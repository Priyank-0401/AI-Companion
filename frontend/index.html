<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seriva - Your personal AI companion for emotional support and wellness" />
    
    <!-- Theme Color Meta Tags -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" id="light-theme-color">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" id="dark-theme-color">
    
    <title>Seriva</title>
    
    <!-- Prevent theme flash and set initial theme -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        try {
          // Get theme from localStorage or system preference
          const getInitialTheme = () => {
            try {
              const savedTheme = localStorage.getItem('theme');
              if (savedTheme) return savedTheme;
              return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } catch (e) {
              console.error('Error getting theme:', e);
              return 'light'; // Default to light theme if any error occurs
            }
          };
          
          // Set initial theme
          const theme = getInitialTheme();
          const root = document.documentElement;
          
          if (root) {
            root.classList.remove('light', 'dark');
            root.classList.add(theme);
            if (root.style) {
              root.style.colorScheme = theme;
            }
            
            // Set initial theme color meta tag
            const themeColor = theme === 'dark' ? '#0f172a' : '#ffffff';
            let metaThemeColor = document.querySelector('meta[name="theme-color"]');
            
            if (!metaThemeColor) {
              metaThemeColor = document.createElement('meta');
              metaThemeColor.name = 'theme-color';
              document.head.appendChild(metaThemeColor);
            }
            metaThemeColor.content = themeColor;
            
            // Apply background color to prevent flash
            if (document.body) {
              document.body.style.backgroundColor = themeColor;
            }
          }
        } catch (e) {
          console.error('Error initializing theme:', e);
        }
      });
    </script>
    
    <link rel="stylesheet" href="/src/theme.css">
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
